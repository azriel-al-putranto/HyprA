# ~/.config/fuzzel/fuzzel.ini

[main]
# Mengatur font (sesuaikan dengan font di sistem Anda, misal: JetBrainsMono)
font=JetBrainsMono Nerd Font:size=12
prompt=">> "
icon-theme=Papirus-Dark
icons-enabled=yes

# Menempatkan di tengah layar
terminal=kitty
layers=overlay

# Mengatur tampilan
width=60
lines=30
horizontal-pad=20
vertical-pad=20
inner-pad=20

# Styling border dan corners
border-width=30
border-radius=10

[colors]
# Tema warna gelap/transparan (kustomisasi sesuai selera)
background=1a1b26ff
text=c0caf5ff
prompt=7aa2f7ff
input=c0caf5ff
match=bb9af7ff
selection=33467cff
selection-text=ffffffff
selection-match=bb9af7ff
border=7aa2f7ff

[border]
radius=30
width=10

[dmenu]
mode=text  # Ganti ke 'net' jika ingin ikon
exit-immediately-if-empty=yes
